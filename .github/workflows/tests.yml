name: tests

# The review that led to this workflow flagged a real bug and it stayed real
# until dev/run_all.py's own compile gate was added: lite_agent.py used to
# contain an f-string with a backslash inside its expression, legal only
# since Python 3.12 (PEP 701) -- a SyntaxError on 3.10/3.11, the exact
# versions install.sh advertises ("python3 (3.10+)") and what Ubuntu 22.04
# (3.10) and Debian 12 / Proxmox VE 8 (3.11) ship. Nothing reachable from this
# project's own development machines was ever old enough to catch it by
# running the code -- this matrix exists specifically to be.
on:
  # Upstream runs this on every branch. This fork is private, so every push
  # is billed Actions minutes -- four Python versions times the full suite,
  # roughly 30 minutes per push -- and feature branches here push often. The
  # matrix still earns its keep on master, which is what /update actually
  # deploys from, so it stays there rather than going dark everywhere.
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is install.sh's stated floor; 3.13 is what a live Proxmox node
        # in this project's own cluster actually runs today. Covering both
        # ends is the point -- a number picked without checking either would
        # just be a guess.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history AND tags. The default is a depth-1 checkout with no
          # tags, and test_release_consistency.py asks git whether the release
          # it is looking at has one -- so it reported "release notes committed
          # with no tag" on every push and CI was red for three releases while
          # the same suite passed locally. A gate that is red for a reason
          # unrelated to the code is a gate people stop reading.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the full suite
        run: python3 dev/run_all.py lite_agent.py
